# GitHub Actions 工作流：每次 push / PR 自动跑构建，给提交打绿勾或红叉。
# 文件放在 .github/workflows/ 下，GitHub 会自动发现并运行——不需要任何注册操作。

# 显示在 GitHub「Actions」页签里的名字
name: CI

# ── 什么时候触发 ──────────────────────────────────────────────
on:
  push:
    branches: [master]          # push 到 master 时跑
  pull_request:
    branches: [master]          # 有人开 PR 想合进 master 时也跑

# ── 要做的活儿 ────────────────────────────────────────────────
# 一个 workflow 下可以有多个 job，job 之间默认并行。
jobs:
  build:
    # GitHub 免费借给我们的一次性虚拟机，用最新的 Ubuntu
    runs-on: ubuntu-latest

    # 这个前端在仓库根目录，若将来挪进子目录，改这里即可
    defaults:
      run:
        working-directory: .

    # npm ci 只装 JS 依赖；浏览器在测试步骤中显式安装，缓存和失败位置更清晰。
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

    # 一台机器从零开始，按顺序执行下面每一步
    steps:
      # 1. 把仓库代码拉到这台机器上（uses = 直接用别人写好的现成动作）
      - name: 拉取代码
        uses: actions/checkout@v4

      # 2. 装 Node。cache: npm 会缓存依赖，第二次起 npm ci 快很多
      - name: 装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. 按 package-lock.json 精确安装依赖。
      #    npm ci 比 npm install 更适合 CI：完全照锁文件装，装前先清空，可复现
      - name: 安装依赖
        run: npm ci

      # 4. 先跑快速单元测试，再安装浏览器执行真实交互回归。
      - name: 单元测试
        run: npm test

      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium

      - name: 端到端测试
        run: npm run test:e2e

      # 5. 最后执行类型检查 + 打包；任一步非零退出都会阻止合并。
      - name: 构建
        run: npm run build

  production-image:
    name: Production image
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建生产镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: incipit-web:ci

      - name: 校验 Nginx 配置
        run: docker run --rm incipit-web:ci nginx -t
